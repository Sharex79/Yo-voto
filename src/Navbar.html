<!-- Navbar compartida por Quiénes somos, Leyes y Programas -->
<nav id="navegacion-informacion" class="navbar navbar-informacion" aria-label="Navegación principal">
  <div class="navbar-informacion__marca">
    <button
      class="navbar-informacion__icono navbar-informacion__ajustes"
      type="button"
      aria-label="Ajustes"
      title="Ajustes"
      aria-controls="panel-ajustes"
      aria-expanded="false"
    >
      <img src="/ajustes.png" alt="" />
    </button>
    <button
      class="navbar-informacion__logo-boton"
      type="button"
      aria-label="Volver al inicio de la página"
      title="Volver al inicio"
    >
      <img class="navbar-informacion__logo" src="/Logo.png" alt="" />
    </button>
    <button
      class="navbar-informacion__icono"
      type="button"
      data-page="dinamica"
      aria-label="Ir a Dinámica"
      title="Dinámica"
    >
      <img src="/pensamiento.png" alt="" />
    </button>
  </div>
  <div class="navbar-informacion__links">
    <button type="button" data-page="informacion">¿Quiénes somos?</button>
    <button type="button" data-page="pagina2">Leyes en España</button>
    <button type="button" data-page="pagina3">Programas</button>
  </div>
</nav>
<button
  class="navbar-informacion__toggle"
  type="button"
  aria-controls="navegacion-informacion"
  aria-expanded="true"
  aria-label="Ocultar navegación"
>
  ↑
</button>
<div class="navbar-informacion__ajustes-capa" aria-hidden="true">
  <aside
    id="panel-ajustes"
    class="navbar-informacion__ajustes-panel"
    aria-label="Menú de información y ajustes"
  >
    <h2>Información</h2>
    <section class="navbar-informacion__grupo">
      <nav class="navbar-informacion__opciones" aria-label="Información">
        <button type="button" data-page="informacion">¿Quiénes somos?</button>
        <button type="button" data-page="pagina2">Leyes en España</button>
        <button type="button" data-page="pagina3">Programas</button>
      </nav>
    </section>
    <button
      class="navbar-informacion__separador"
      type="button"
      data-page="dinamica"
      aria-label="Ir a Dinámica"
      title="Ir a Dinámica"
    >
      <img src="/Logo.png" alt="" />
    </button>
    <section class="navbar-informacion__grupo navbar-informacion__grupo--ajustes">
      <h2>Ajustes</h2>
      <nav class="navbar-informacion__opciones" aria-label="Ajustes">
        <button
          class="navbar-informacion__idioma-abrir"
          type="button"
          aria-haspopup="dialog"
          aria-controls="selector-idioma"
        >
          Idioma
        </button>
      </nav>
    </section>
  </aside>
</div>
<div class="navbar-informacion__idioma-capa" aria-hidden="true">
  <section
    id="selector-idioma"
    class="navbar-informacion__idioma-dialogo"
    role="dialog"
    aria-modal="true"
    aria-label="Seleccionar idioma"
  >
    <h2>Idioma</h2>
    <div class="navbar-informacion__idiomas">
      <button type="button" data-idioma="es" aria-label="Español" aria-pressed="false">
        <span aria-hidden="true">ES</span>
        <span>Español</span>
      </button>
      <button type="button" data-idioma="en" aria-label="English" aria-pressed="false">
        <span aria-hidden="true">EN</span>
        <span>English</span>
      </button>
      <button type="button" data-idioma="ca" aria-label="Català" aria-pressed="false">
        <span aria-hidden="true">CA</span>
        <span>Català</span>
      </button>
    </div>
  </section>
</div>
