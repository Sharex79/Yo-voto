<div class="footer footer-informacion">
  <div class="footer-informacion__principal">
    <a class="footer-informacion__marca" href="#" aria-label="Yo Voto, inicio">
      <img src="/Logo.png" alt="Yo Voto" />
    </a>
    <section class="footer-informacion__contacto" aria-labelledby="footer-contacto-titulo">
      <h2 id="footer-contacto-titulo">Nuestras redes son...</h2>
      <div class="footer-informacion__botones">
        <button type="button" data-contacto="instagram">Instagram</button>
        <button type="button" data-contacto="facebook">Facebook</button>
        <button type="button" data-contacto="x">X</button>
        <button type="button" data-contacto="correo">Correo</button>
      </div>
    </section>
  </div>

  <section class="footer-informacion__legales" aria-labelledby="footer-legales-titulo">
    <h2 id="footer-legales-titulo">Legalidades</h2>
    <button
      class="footer-informacion__legales-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="footer-enlaces-legales"
      aria-label="Mostrar información legal"
      title="Mostrar información legal"
    >
      ↓
    </button>
    <div id="footer-enlaces-legales" class="footer-informacion__legales-lista" aria-hidden="true">
      <button type="button">Aviso legal</button>
      <button type="button">Política de privacidad</button>
      <button type="button">Política de cookies</button>
      <button type="button">Accesibilidad</button>
